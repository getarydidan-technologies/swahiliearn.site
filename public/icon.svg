<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="swahiliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0047BA"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#swahiliGrad)"/>
  
  <!-- Subtle glass shine -->
  <path d="M0,0 L512,0 C512,180 340,320 0,380 Z" fill="white" fill-opacity="0.06"/>
  
  <!-- Stylized chat bubbles + Currency symbol -->
  <g transform="translate(64, 76)">
    <!-- Primary Chat Bubble -->
    <path d="M40 70 C40 31.3 71.3 0 110 0 L274 0 C312.7 0 344 31.3 344 70 L344 190 C344 228.7 312.7 260 274 260 L140 260 L60 320 L68 255 C48 240 40 216 40 190 Z" fill="#FFFFFF" filter="drop-shadow(0px 8px 24px rgba(0,0,0,0.15))"/>
    
    <!-- Accent Secondary Bubble / Coin -->
    <circle cx="280" cy="240" r="76" fill="url(#accentGrad)" filter="drop-shadow(0px 8px 20px rgba(255,85,0,0.35))"/>
    <text x="280" y="264" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="70" fill="#FFFFFF" text-anchor="middle">S</text>
    
    <!-- Stylized Swahili 'SE' text inside bubble -->
    <text x="175" y="150" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="88" fill="#0066FF" letter-spacing="-2" text-anchor="middle">SE</text>
  </g>
</svg>
